[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discharge-summary-cms-readmission"
version = "2.0.0"
description = "LACE index calculator and experimental discharge audit utilities"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "httpx>=0.26,<1",
]

[project.scripts]
discharge-summary-cms-readmission = "lace_readmission.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/discharge-summary-cms-readmission"
Repository = "https://github.com/abusuraihsakhri/discharge-summary-cms-readmission.git"
