name: Publish research calculator

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed calculator assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 "$PAGE_URL" -o /tmp/lace-page.html
          grep -Fq "LACE readmission index" /tmp/lace-page.html
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/app.js" -o /tmp/lace-app.js
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/style.css" -o /tmp/lace-style.css
          grep -Fq "function calculateLace" /tmp/lace-app.js
          grep -Fq ".layout" /tmp/lace-style.css
          node --check /tmp/lace-app.js
